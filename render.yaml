services:
  - type: web
    name: sepay-balance-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: SEPAY_WEBHOOK_PATH
        value: /webhooks/sepay
      - key: SEPAY_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: NOTIFY_OUTGOING
        value: true
      - key: DEDUPE_FILE
        value: /opt/render/project/src/data/processed-webhooks.json
      - key: MAX_BODY_SIZE
        value: 1048576